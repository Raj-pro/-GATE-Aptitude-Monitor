<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunny-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Gradient Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#sunny-grad)" />

  <!-- Graduation Cap Emoji / Graphic -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-size="34" text-anchor="middle" dominant-baseline="central" filter="url(#shadow)">
    🎓
  </text>
</svg>
